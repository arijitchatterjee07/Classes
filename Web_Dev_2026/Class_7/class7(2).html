<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{background-color:salmon;}
        table {border: 1px solid lightblue;
        background-color:lightyellow;}
        thead {background-color:palevioletred;}
        td {border: 1px solid lightgreen;}
        .class{background-color:wheat;}
    </style>
</head>

<body>
    <h1>Table Demo</h1>
    <h2>Schedule</h2>
    <br/>
    <table>
        <thead>
            <tr>
                <th>Day</th>
                <th>StartTime</th>
                <th>EndTime</th>
                <th>Event</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>9:00 AM</td>
                <td>10:00 AM</td>
                <td>Google Interview</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>10:00 AM</td>
                <td>11:00 AM</td>
                <td>Microsoft Interview</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>11:00 AM</td>
                <td>12:00 PM</td>
                <td>Spotify Interview</td>
            </tr>
            <tr>
                <td>Thursday</td>
                <td>12:00 PM</td>
                <td>1:00 PM</td>
                <td>Apple Interview</td>
            </tr>
        <tbody>
    </table>
</body>
</html>
